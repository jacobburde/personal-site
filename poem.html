<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poem | Illuminations</title>
  <meta name="description" content="An illuminated poem">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/etched-text.css">
  <link rel="stylesheet" href="css/borders.css">
  <link rel="stylesheet" href="css/poem.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Favicon placeholder -->
  <link rel="icon" href="data:,">
</head>
<body class="poem-page">
  <!-- Navigation -->
  <nav class="poem-nav" aria-label="Poem navigation">
    <a href="index.html" class="nav-home etched">Return to Index</a>
    <div class="nav-adjacent">
      <a href="#" class="nav-prev etched" hidden>Previous</a>
      <a href="#" class="nav-next etched" hidden>Next</a>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="poem-container">
    <!-- Loading State -->
    <div class="poem-loading">
      <p class="loading-text etched">Loading...</p>
    </div>

    <!-- Error State (hidden by default) -->
    <div class="poem-error" style="display: none;">
      <p class="error-text etched">Could not load poem</p>
      <p><a href="index.html" class="etched-gold">Return to index</a></p>
    </div>

    <!-- Poem Content (populated by JS) -->
    <article class="poem-article illuminated-frame poem-content-wrapper" style="display: none;">
      <!-- Corner ornaments -->
      <span class="corner corner--tl border-element" aria-hidden="true"></span>
      <span class="corner corner--tr border-element" aria-hidden="true"></span>
      <span class="corner corner--bl border-element" aria-hidden="true"></span>
      <span class="corner corner--br border-element" aria-hidden="true"></span>

      <!-- Edge decorations -->
      <span class="edge edge--top border-element" aria-hidden="true"></span>
      <span class="edge edge--bottom border-element" aria-hidden="true"></span>
      <span class="edge edge--left border-element" aria-hidden="true"></span>
      <span class="edge edge--right border-element" aria-hidden="true"></span>

      <!-- Poem Header -->
      <header class="poem-header">
        <h1 class="poem-title etched-deep"></h1>
        <p class="poem-attribution etched" style="display: none;"></p>
      </header>

      <!-- Poem Body -->
      <div class="poem-content">
        <div class="poem-body etched"></div>
      </div>
    </article>
  </main>

  <!-- Footer ornament -->
  <footer class="poem-footer">
    <span class="footer-ornament" aria-hidden="true"></span>
  </footer>

  <!-- Scripts -->
  <script src="js/main.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/poem-loader.js"></script>
</body>
</html>
